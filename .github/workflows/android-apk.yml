name: Android APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public HTTPS API base URL, including /api"
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate API URL
        run: |
          node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_URL); if(u.protocol!=="https:" || /^(localhost|127\.|10\.|192\.168\.)/.test(u.hostname)) throw Error("A public HTTPS API URL is required")'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Typecheck mobile
        run: bun run --cwd artifacts/mobile typecheck
      - name: Generate Android project
        working-directory: artifacts/mobile
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
      - name: Build installable preview APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Package preview
        run: cp artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk floma-android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: floma-android-preview
          path: floma-android-preview.apk
          retention-days: 30
