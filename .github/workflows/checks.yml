name: Storefront checks
on:
  push:
  pull_request:
concurrency:
  group: storefront-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: griper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/griper_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/griper_test
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run --cwd lib/db push
      - run: bun run --cwd artifacts/api-server test
      - run: bun run --cwd artifacts/api-server build
      - run: bun run --cwd artifacts/admin-web build
      - name: Export Expo web
        working-directory: artifacts/mobile
        run: ./node_modules/.bin/expo export --platform web
